id = "bethanyj28.new-workspace"
name = "New Workspace"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Popup for picking a project directory and an agent before creating a workspace."
platforms = ["linux", "macos"]

[[panes]]
id = "picker"
title = "New workspace"
placement = "popup"
width = "80%"
height = "70%"
command = ["zsh", "herdr-new-workspace"]

[[actions]]
id = "open"
title = "New workspace"
command = ["zsh", "herdr-new-workspace", "--open"]
